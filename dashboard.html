<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ING Macro Scenarios</title>
<style>
:root{--bg:#0f1419;--card:#1a212b;--line:#2b3542;--tx:#e6e9ee;--mut:#8b97a7;--base:#4a90e2;--bull:#2ecc71;--bear:#e74c3c;--tail:#a56cf0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif}
header{padding:18px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
h1{margin:0;font-size:20px}.mut{color:var(--mut);font-size:13px}
nav{display:flex;gap:6px}nav button{background:var(--card);color:var(--tx);border:1px solid var(--line);padding:7px 14px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--base);border-color:var(--base)}
main{padding:24px 28px;max-width:1400px;margin:auto}
.filters{margin-bottom:16px;display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:12px;border:1px solid var(--line);cursor:pointer;font-size:13px;background:var(--card)}.chip.on{background:var(--tx);color:var(--bg)}
.story{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:22px}
.story h2{margin:0 0 2px;font-size:18px}.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--line);margin:0 4px 4px 0}
.scs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}
.sc{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:8px;padding:12px;background:#151b23}
.sc h3{margin:0;font-size:15px}.sc .t{color:var(--c);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.pr{font-size:28px;font-weight:700;margin:4px 0}.up{color:var(--bull)}.dn{color:var(--bear)}.pr small{font-size:13px;margin-left:6px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}.bar i{display:block;height:100%;background:var(--c)}
.sc p{margin:6px 0;font-size:13.5px}.sc b{color:var(--mut);font-weight:600}
svg{width:100%;height:150px;margin-top:14px;background:#151b23;border-radius:8px}
.legend span{margin-right:14px;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;background:var(--c)}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px}summary{cursor:pointer;font-weight:600}
a{color:var(--base)}.log{padding:8px 0;border-bottom:1px solid var(--line)}
.empty{padding:40px;text-align:center;color:var(--mut)}
</style></head><body>
<header><div><h1>ING Macro Stories &amp; Scenarios</h1><div class="mut" id="meta"></div></div>
<nav id="nav"></nav></header>
<main id="main"></main>
<script id="data" type="application/json">{"papers": [{"id": "ecb-french-drama", "date": "2026-10-22", "title": "ECB caught in the French drama (Carsten Brzeski)", "url": "https://think.ing.com/articles/ecb-caught-in-the-french-drama/", "summary": "ECB expected on hold on 29 Oct. The jump in bond yields after the French crisis already tightens policy: German yields ~ a 25bp hike, France ~ 50bp. Next hike decision pushed to December (new projections). Path depends on Middle East war length, energy pass-through, and French contagion. Defences: dovish rates, flexible reinvestment (pause QT), then TPI, which is hard to justify while France is non-compliant with fiscal rules.", "story_ids": ["france-ecb", "oil-iran"]}, {"id": "fx-daily-safe-haven", "date": "2026-10-23", "title": "FX Daily: Dollar has lost its safe-haven crown", "url": "https://think.ing.com/articles/fx-daily-dollar-has-lost-its-safe-haven-crown/", "summary": "Equities sold off on oil and AI worries; JPY and CHF were the safe-haven winners, not USD. Bond/equity negative correlation is back. UST 10y below 5%, 2y SOFR swap -15bp to 4.50%, but the bar to price out a December Fed hike is high. OAT-Bund 10y at 174bp (peak 178bp); EUR sensitivity to France can return quickly. CEE hit by risk-off (PLN, HUF vulnerable; EUR/HUF capped 368-370). MXN -8% since early Sept; Banxico dovish; USD/MXN 19.00-19.10 trajectory.", "story_ids": ["usd-rates-ai", "france-ecb"]}, {"id": "rates-spark-5pct", "date": "2026-10-22", "title": "Rates Spark: US and France like ships passing in the night at 5%", "url": "https://think.ing.com/articles/rates-spark-us-and-france-like-ships-passing-in-the-night-at-5/", "summary": "UST 10y broke below 5% on risk-off; ING expects it to revert above 5% (inflation, deficits, AI boom, US midterms), timing uncertain. French 10y above 5%, spread ~175bp vs Germany. Moody's (Aa3 negative) downgrade looks overdue, no fixed release time. A lasting French relief needs a credible 2027 budget, possibly not before December. Weak PMIs could trigger a bullish rates repricing and a more dovish ECB.", "story_ids": ["usd-rates-ai", "france-ecb"]}, {"id": "commodities-brent", "date": "2026-10-23", "title": "The Commodities Feed: Brent builds geopolitical premium as Gulf risks rise", "url": "https://think.ing.com/articles/the-commodities-feed-brent-risk-premium-builds-with-fears-of-re-escalation/", "summary": "Brent +4% to just above $113/bbl on fears of renewed US-Iran escalation (reported strike consideration, second carrier, troop evacuations). ING's 4Q26 $80 average now looks unattainable; re-escalation seen as most likely path. TTF above EUR90/MWh (highest since Dec 2022); LNG largely absent this winter. Gold -2.8% toward $4,000 on inflation/policy worries; copper down on rising inventories and AI-stock selloff.", "story_ids": ["oil-iran", "usd-rates-ai"]}, {"date": "2026-10-26", "title": "October ECB cheat sheet: French malaise shouldn't prompt a dovish turn", "url": "https://think.ing.com/articles/october-ecb-cheat-sheet-french-malaise-shouldnt-prompt-a-dovish-turn/", "summary": "ECB expected to hold at 2.5% on 29 Oct and keep the door open for a December hike, with a neutral, balanced message; a hike this week is priced near zero. Markets look for signs the French turmoil has triggered a dovish rethink - ING says not yet. EUR undervalued 1-1.5% vs short-term fair value; balance of risks still to the downside, but baseline is a broadly stable euro. ING preference: EUR/USD back to 1.120-1.130 in coming weeks. A surprise hike would risk a broader risk-off move, wider OAT spreads, lower equities and even lower Bund yields.", "id": "ecb-cheat-sheet", "story_ids": ["france-ecb", "usd-rates-ai"]}, {"date": "2026-10-27", "title": "FX Daily: Dollar buying returns ahead of FOMC", "url": "https://think.ing.com/articles/fx-daily-dollar-buying-returns-ahead-of-fomc/", "summary": "Dollar firmer at the start of the week as AI-related sentiment stabilises and markets position ahead of the FOMC; Chair Kevin Warsh reiterating inflation commitments reinforces the structural dollar floor. ING expects a broadly supported dollar this week. US consumer confidence seen at 81.5 (consensus 81.0) after 81.9 in September - soft data could dent hike pricing. Israeli election is tight; both Netanyahu and Eisenkot blocs short of a majority, Eisenkot marginally more diplomatic on Iran. RBNZ expected to deliver a hawkish 25bp hike; NZD/USD 0.570 4Q forecast. CEE rates reconnecting with higher energy prices; CEE FX downside risk exceeds upside.", "id": "fx-daily-dollar-buying", "story_ids": ["usd-rates-ai", "oil-iran"]}, {"date": "2026-10-26", "title": "Rates Spark: Temporary relief for structural problems", "url": "https://think.ing.com/articles/rates-spark-temporary-relief-for-structural-problems/", "summary": "Moody's kept France at double-A (negative outlook), so the 10y OAT-Bund spread narrowed more than 10bp to below 155bp after being at its widest since 2011. Relief only - France still needs a significant, sustained fiscal effort, politics stay fragmented, elections are in April 2027, and a tail risk is support for Melenchon. For the ECB, the retightening removes some pressure to hike and lets officials keep constructive ambiguity. Elevated energy and resilient data outside France keep hawkish pressure on front-end rates.", "id": "rates-spark-relief", "story_ids": ["france-ecb", "usd-rates-ai"]}], "stories": [{"id": "france-ecb", "name": "French fiscal crisis and the ECB", "category": "Europe", "updated": "2026-10-27", "summary": "Moody's kept France at AA with a negative outlook, and the OAT-Bund spread narrowed to below 155bp from an 11-year wide. That is relief, not resolution: France still needs a sustained fiscal effort, elections are in April 2027, and Melenchon is a tail risk. The ECB is expected to hold at 2.5% on 29 Oct and keep a December hike on the table, which shelters EUR. ING's preference is EUR/USD back to 1.120-1.130.", "pairs": ["EURUSD", "EURCHF", "EURJPY", "EURGBP"], "paper_ids": ["ecb-french-drama", "fx-daily-safe-haven", "rates-spark-5pct", "ecb-cheat-sheet", "rates-spark-relief"], "scenarios": [{"name": "Contained, grinding stress", "type": "base", "probability": 62, "description": "Spreads hold roughly 145-175bp after the Moody's relief, budget talks drag on and the ECB holds at 2.5% with a neutral message. No TPI.", "triggers": ["OAT-Bund spread", "April 2027 elections", "ECB 29 Oct tone"], "fx_impact": "EUR range-bound with a downside skew; the EUR/France correlation spikes on bad days.", "history": [{"date": "2026-10-23", "probability": 55, "note": "Initial estimate (analyst judgement, not ING's)"}, {"date": "2026-10-27", "probability": 62, "note": "Moody's kept France at AA on 26 Oct; OAT-Bund narrowed to <155bp. Near-term downgrade trigger removed, structural problems unchanged."}]}, {"name": "French relief", "type": "bull", "probability": 13, "description": "Credible 2027 budget with real consolidation and calmer risk sentiment; spreads retrace.", "triggers": ["Budget adoption", "Political stability"], "fx_impact": "EUR supported; ECB hike pricing returns, positive for EURUSD.", "history": [{"date": "2026-10-23", "probability": 15, "note": "Initial estimate (analyst judgement, not ING's)"}, {"date": "2026-10-27", "probability": 13, "note": "Much of the relief already happened via the spread tightening; a lasting move needs a credible 2027 budget."}]}, {"name": "Contagion and ECB backstop", "type": "bear", "probability": 20, "description": "Spreads blow out past 180bp, Italy/Spain widen, ECB pauses QT or reinvests flexibly, and TPI becomes live (possibly excluding France).", "triggers": ["Spread above 180bp", "Italian/Spanish spreads", "ECB QT language"], "fx_impact": "EUR weaker; safe-haven bid for CHF/JPY; Bunds rally.", "history": [{"date": "2026-10-23", "probability": 25, "note": "Initial estimate (analyst judgement, not ING's)"}, {"date": "2026-10-27", "probability": 20, "note": "Spreads off their peak, but ING still sees wider spreads ahead and won't call the end of the turmoil."}]}, {"name": "Disorderly sovereign event", "type": "tail", "probability": 5, "description": "Failed auctions or a multi-notch downgrade cascade force emergency policy action.", "triggers": ["Auction failures", "Multiple downgrades"], "fx_impact": "Sharp EUR sell-off, strong CHF.", "history": [{"date": "2026-10-23", "probability": 5, "note": "Initial estimate (analyst judgement, not ING's)"}, {"date": "2026-10-27", "probability": 5, "note": "Unchanged: April 2027 elections and a Melenchon tail keep the risk alive."}]}]}, {"id": "oil-iran", "name": "Oil shock and US-Iran re-escalation", "category": "Geopolitics / Commodities", "updated": "2026-10-27", "summary": "Brent above $113 still carries a large Gulf risk premium and ING's $80 4Q26 call is gone. No new oil note this week, but ING calls high energy prices a core driver of rates and inflation. Today's Israeli election is a new political variable: Eisenkot is seen as slightly softer on Iran than Netanyahu, so a workable coalition is the main de-escalation channel alongside diplomacy.", "pairs": ["USDCAD", "USDNOK", "EURUSD", "USDJPY", "XAUUSD"], "paper_ids": ["ecb-french-drama", "commodities-brent", "fx-daily-dollar-buying"], "scenarios": [{"name": "Elevated premium, no major disruption", "type": "base", "probability": 40, "description": "Brent stays $100-120 on threats and military build-up, with flows still intact.", "triggers": ["Gulf shipping flows", "US statements"], "fx_impact": "CAD/NOK supported; JPY and EUR pressured by terms of trade.", "history": [{"date": "2026-10-23", "probability": 40, "note": "Initial estimate (analyst judgement, not ING's)"}, {"date": "2026-10-27", "probability": 40, "note": "No new oil paper this week; ING still flags high energy prices as a core driver."}]}, {"name": "De-escalation", "type": "bull", "probability": 18, "description": "Diplomacy or the midterm effect calms tensions; the premium unwinds and Brent heads toward $90.", "triggers": ["Talks announced", "Carrier withdrawal"], "fx_impact": "Oil FX fades; EUR and JPY relief; lower hike pricing.", "history": [{"date": "2026-10-23", "probability": 15, "note": "Initial estimate (analyst judgement, not ING's)"}, {"date": "2026-10-27", "probability": 18, "note": "New: today's Israeli election could reset the Middle East equilibrium - Eisenkot is seen as more diplomatic on Iran."}]}, {"name": "Re-escalation, flows threatened", "type": "bear", "probability": 36, "description": "US strikes on Iran and disruption risk; Brent above $120, gas spikes further.", "triggers": ["US strikes", "Hormuz incidents", "Troop evacuations"], "fx_impact": "USD mixed (haven demand weak); JPY/CHF and CAD/NOK strongest; EUR hit by energy.", "history": [{"date": "2026-10-23", "probability": 38, "note": "Initial estimate (analyst judgement, not ING's)"}, {"date": "2026-10-27", "probability": 36, "note": "Upgrades from 38 to 36: still the dominant risk, but the election adds a political off-ramp."}]}, {"name": "Major supply outage", "type": "tail", "probability": 6, "description": "Actual loss of Gulf flows; Brent far above $130.", "triggers": ["Tanker attacks", "Facility damage"], "fx_impact": "Severe risk-off; CHF/JPY surge; EM FX sells off.", "history": [{"date": "2026-10-23", "probability": 7, "note": "Initial estimate (analyst judgement, not ING's)"}, {"date": "2026-10-27", "probability": 6, "note": "Trimmed slightly: flows remain intact and no new escalation headlines."}]}]}, {"id": "usd-rates-ai", "name": "US rates, Fed hike risk and AI-valuation wobble", "category": "US / Rates", "updated": "2026-10-27", "summary": "The dollar has regained support as AI-related sentiment stabilises and markets position for the FOMC: Chair Warsh's restated inflation commitment is treated as a structural floor for USD, and ING expects a broadly supported dollar this week. Soft consumer confidence (81.5 expected after 81.9) is the main data risk to tightening expectations. JPY/CHF keep their haven role on risk-off days.", "pairs": ["USDJPY", "USDCHF", "EURUSD", "XAUUSD"], "paper_ids": ["fx-daily-safe-haven", "rates-spark-5pct", "commodities-brent", "ecb-cheat-sheet", "fx-daily-dollar-buying", "rates-spark-relief"], "scenarios": [{"name": "Choppy around 5%, Dec hike alive", "type": "base", "probability": 43, "description": "10y oscillates around 5%, USD consolidates if risk calms; JPY/CHF keep a haven bid on sell-offs.", "triggers": ["FOMC", "US consumer confidence", "AI equity moves"], "fx_impact": "USD range-trade; USDJPY and USDCHF downside on risk-off days.", "history": [{"date": "2026-10-23", "probability": 45, "note": "Initial estimate (analyst judgement, not ING's)"}, {"date": "2026-10-27", "probability": 43, "note": "AI sentiment stabilised; dollar reconnecting with the hawkish Fed backdrop."}]}, {"name": "Yields back above 5%, hawkish Fed", "type": "bull", "probability": 30, "description": "Inflation, deficits and oil push yields up; December hike priced in; USD rebounds.", "triggers": ["Hot CPI", "Fed speakers", "Midterm fiscal worries"], "fx_impact": "USD up broadly; USDJPY higher; gold under pressure.", "history": [{"date": "2026-10-23", "probability": 25, "note": "Initial estimate (analyst judgement, not ING's)"}, {"date": "2026-10-27", "probability": 30, "note": "Raised: ING now expects a broadly supported dollar this week into the FOMC, with Warsh stressing inflation commitments."}]}, {"name": "AI-led risk-off and growth scare", "type": "bear", "probability": 22, "description": "Equity sell-off deepens and data weaken; hike pricing collapses; yields fall sharply.", "triggers": ["Weak PMIs", "AI stock drawdown"], "fx_impact": "JPY and CHF rally; USD weaker; EM FX sells off.", "history": [{"date": "2026-10-23", "probability": 25, "note": "Initial estimate (analyst judgement, not ING's)"}, {"date": "2026-10-27", "probability": 22, "note": "Lowered from 25: the AI-driven risk-off impulse that dominated last week has faded for now."}]}, {"name": "Disorderly bond/equity break", "type": "tail", "probability": 5, "description": "Disorderly Treasury/equity move forces central bank response.", "triggers": ["Failed auctions", "Credit spreads"], "fx_impact": "Extreme haven flows; thin liquidity.", "history": [{"date": "2026-10-23", "probability": 5, "note": "Initial estimate (analyst judgement, not ING's)"}, {"date": "2026-10-27", "probability": 5, "note": "Unchanged."}]}]}], "changelog": [{"date": "2026-10-23", "text": "Batch 1: four ING articles (22-23 Oct 2026) analysed; four stories created. Probabilities are initial estimates."}, {"date": "2026-10-27", "text": "France: Moody's kept France at double-A (negative outlook) instead of downgrading; OAT-Bund tightened >10bp to <155bp from an 11-year wide. Contained-stress probability raised 55% -> 62%, contagion cut 25% -> 20%, relief cut 15% -> 13%."}, {"date": "2026-10-27", "text": "ECB: the 29 Oct meeting is now framed as a hold at 2.5% with the door open for December, not a debate about hiking now. Baseline is a neutral message and a broadly stable euro, with EUR/USD targeted at 1.120-1.130."}, {"date": "2026-10-27", "text": "USD: the narrative flipped this week. Last week the dollar had 'lost its safe-haven crown'; now stabilising AI sentiment and pre-FOMC positioning have brought dollar buying back. Hawkish-Fed scenario raised 25% -> 30%, AI risk-off cut 25% -> 22%."}, {"date": "2026-10-27", "text": "Oil: no new commodity note, but the Israeli election is a fresh de-escalation channel (Eisenkot softer on Iran than Netanyahu). De-escalation 15% -> 18%, re-escalation 38% -> 36%, supply outage 7% -> 6%."}, {"date": "2026-10-27", "text": "Removed the 'EM and CEE FX under pressure' story at your request. The source detail (MXN, PLN, HUF, RON) is still recorded inside the papers, and ING still flags CEE FX downside risk in this week's FX Daily."}, {"date": "2026-10-27", "text": "Still open: FOMC tomorrow, ECB on 29 Oct, RBNZ (hawkish 25bp expected), US consumer confidence today."}]}</script>
<script>
const S=JSON.parse(document.getElementById('data').textContent);
const COL={base:'var(--base)',bull:'var(--bull)',bear:'var(--bear)',tail:'var(--tail)'};
const LBL={base:'Base case',bull:'Upside',bear:'Downside',tail:'Tail risk'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let view='stories',cat='All';
const shift=sc=>{const h=sc.history||[];return h.length>1?h[h.length-1].probability-h[h.length-2].probability:null};
function chart(st){
 const series=st.scenarios.map(sc=>({sc,h:sc.history||[]})).filter(x=>x.h.length);
 if(!series.length)return'';
 const dates=[...new Set(series.flatMap(x=>x.h.map(p=>p.date)))].sort();
 const W=600,H=150,P=24,x=d=>dates.length>1?P+(W-2*P)*dates.indexOf(d)/(dates.length-1):W/2,y=v=>H-P-(H-2*P)*v/100;
 let g=[0,50,100].map(v=>`<line x1="${P}" x2="${W-P}" y1="${y(v)}" y2="${y(v)}" stroke="#2b3542"/><text x="2" y="${y(v)+4}" fill="#8b97a7" font-size="10">${v}</text>`).join('');
 g+=dates.map(d=>`<text x="${x(d)}" y="${H-6}" fill="#8b97a7" font-size="10" text-anchor="middle">${esc(d.slice(5))}</text>`).join('');
 for(const {sc,h} of series){const c={base:'#4a90e2',bull:'#2ecc71',bear:'#e74c3c',tail:'#a56cf0'}[sc.type]||'#ccc';
  g+=`<polyline fill="none" stroke="${c}" stroke-width="2" points="${h.map(p=>x(p.date)+','+y(p.probability)).join(' ')}"/>`+h.map(p=>`<circle cx="${x(p.date)}" cy="${y(p.probability)}" r="3" fill="${c}"><title>${esc(sc.name)} ${p.probability}% (${esc(p.date)}) ${esc(p.note)}</title></circle>`).join('')}
 return `<svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="legend">${series.map(({sc})=>`<span style="--c:${COL[sc.type]||'#ccc'}"><i></i>${esc(sc.name)}</span>`).join('')}</div>`}
function scCard(sc){const d=shift(sc);
 return `<div class="sc" style="--c:${COL[sc.type]||'#888'}"><div class="t">${LBL[sc.type]||''}</div><h3>${esc(sc.name)}</h3>
 <div class="pr">${sc.probability}%${d!==null?`<small class="${d>=0?'up':'dn'}">${d>=0?'▲':'▼'} ${Math.abs(d)}</small>`:''}</div>
 <div class="bar"><i style="width:${sc.probability}%"></i></div><p>${esc(sc.description)}</p>
 ${(sc.triggers||[]).length?`<p><b>Watch:</b> ${sc.triggers.map(esc).join('; ')}</p>`:''}
 ${sc.fx_impact?`<p><b>FX impact:</b> ${esc(sc.fx_impact)}</p>`:''}</div>`}
function stories(){
 if(!S.stories.length)return'<div class="empty">No stories yet. Paste ING articles in the chat to populate this dashboard.</div>';
 const cats=['All',...new Set(S.stories.map(s=>s.category).filter(Boolean))];
 const list=S.stories.filter(s=>cat==='All'||s.category===cat);
 return `<div class="filters">${cats.map(c=>`<span class="chip ${c===cat?'on':''}" onclick="cat='${esc(c)}';render()">${esc(c)}</span>`).join('')}</div>`+
 list.map(s=>`<section class="story"><h2>${esc(s.name)}</h2><div class="mut">${esc(s.category)} · updated ${esc(s.updated)}</div>
 <p>${esc(s.summary)}</p>${(s.pairs||[]).map(p=>`<span class="tag">${esc(p)}</span>`).join('')}
 <div class="scs">${s.scenarios.map(scCard).join('')}</div>${chart(s)}</section>`).join('')}
function papers(){return S.papers.length?[...S.papers].sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<details><summary>${esc(p.date)} – ${esc(p.title)}</summary><p>${esc(p.summary)}</p>${p.url?`<p><a href="${esc(p.url)}" target="_blank" rel="noopener">Source</a></p>`:''}<div class="mut">Stories: ${(p.story_ids||[]).map(esc).join(', ')}</div></details>`).join(''):'<div class="empty">No papers yet.</div>'}
function changes(){return S.changelog.length?[...S.changelog].sort((a,b)=>b.date.localeCompare(a.date)).map(c=>`<div class="log"><b>${esc(c.date)}</b> – ${esc(c.text)}</div>`).join(''):'<div class="empty">No changes logged yet.</div>'}
function render(){
 document.getElementById('meta').textContent=`${S.papers.length} papers · ${S.stories.length} stories`;
 const V={stories:'Stories & scenarios',papers:'Papers',changes:'What changed'};
 document.getElementById('nav').innerHTML=Object.entries(V).map(([k,v])=>`<button class="${k===view?'on':''}" onclick="view='${k}';render()">${v}</button>`).join('');
 document.getElementById('main').innerHTML={stories,papers,changes}[view]()}
render();
</script></body></html>

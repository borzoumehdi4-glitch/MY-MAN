<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ING Macro Scenarios</title>
<style>
:root{--bg:#0f1419;--card:#1a212b;--line:#2b3542;--tx:#e6e9ee;--mut:#8b97a7;--base:#4a90e2;--bull:#2ecc71;--bear:#e74c3c;--tail:#a56cf0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif}
header{padding:18px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
h1{margin:0;font-size:20px}.mut{color:var(--mut);font-size:13px}
nav{display:flex;gap:6px}nav button{background:var(--card);color:var(--tx);border:1px solid var(--line);padding:7px 14px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--base);border-color:var(--base)}
main{padding:24px 28px;max-width:1400px;margin:auto}
.filters{margin-bottom:16px;display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:12px;border:1px solid var(--line);cursor:pointer;font-size:13px;background:var(--card)}.chip.on{background:var(--tx);color:var(--bg)}
.story{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:22px}
.story h2{margin:0 0 2px;font-size:18px}.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--line);margin:0 4px 4px 0}
.scs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}
.sc{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:8px;padding:12px;background:#151b23}
.sc h3{margin:0;font-size:15px}.sc .t{color:var(--c);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.pr{font-size:28px;font-weight:700;margin:4px 0}.up{color:var(--bull)}.dn{color:var(--bear)}.pr small{font-size:13px;margin-left:6px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}.bar i{display:block;height:100%;background:var(--c)}
.sc p{margin:6px 0;font-size:13.5px}.sc b{color:var(--mut);font-weight:600}
svg{width:100%;height:150px;margin-top:14px;background:#151b23;border-radius:8px}
.legend span{margin-right:14px;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;background:var(--c)}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px}summary{cursor:pointer;font-weight:600}
a{color:var(--base)}.log{padding:8px 0;border-bottom:1px solid var(--line)}
.empty{padding:40px;text-align:center;color:var(--mut)}
</style></head><body>

<script id="data" type="application/json">{"papers": [{"id": "ecb-french-drama", "date": "2026-10-22", "title": "ECB caught in the French drama (Carsten Brzeski)", "url": "https://think.ing.com/articles/ecb-caught-in-the-french-drama/", "summary": "ECB expected on hold on 29 Oct. The jump in bond yields after the French crisis already tightens policy: German yields ~ a 25bp hike, France ~ 50bp. Next hike decision pushed to December (new projections). Path depends on Middle East war length, energy pass-through, and French contagion. Defences: dovish rates, flexible reinvestment (pause QT), then TPI, which is hard to justify while France is non-compliant with fiscal rules.", "story_ids": ["france-ecb", "oil-iran"]}, {"id": "fx-daily-safe-haven", "date": "2026-10-23", "title": "FX Daily: Dollar has lost its safe-haven crown", "url": "https://think.ing.com/articles/fx-daily-dollar-has-lost-its-safe-haven-crown/", "summary": "Equities sold off on oil and AI worries; JPY and CHF were the safe-haven winners, not USD. Bond/equity negative correlation is back. UST 10y below 5%, 2y SOFR swap -15bp to 4.50%, but the bar to price out a December Fed hike is high. OAT-Bund 10y at 174bp (peak 178bp); EUR sensitivity to France can return quickly. CEE hit by risk-off (PLN, HUF vulnerable; EUR/HUF capped 368-370). MXN -8% since early Sept; Banxico dovish; USD/MXN 19.00-19.10 trajectory.", "story_ids": ["usd-rates-ai", "france-ecb"]}, {"id": "rates-spark-5pct", "date": "2026-10-22", "title": "Rates Spark: US and France like ships passing in the night at 5%", "url": "https://think.ing.com/articles/rates-spark-us-and-france-like-ships-passing-in-the-night-at-5/", "summary": "UST 10y broke below 5% on risk-off; ING expects it to revert above 5% (inflation, deficits, AI boom, US midterms), timing uncertain. French 10y above 5%, spread ~175bp vs Germany. Moody's (Aa3 negative) downgrade looks overdue, no fixed release time. A lasting French relief needs a credible 2027 budget, possibly not before December. Weak PMIs could trigger a bullish rates repricing and a more dovish ECB.", "story_ids": ["usd-rates-ai", "france-ecb"]}, {"id": "commodities-brent", "date": "2026-10-23", "title": "The Commodities Feed: Brent builds geopolitical premium as Gulf risks rise", "url": "https://think.ing.com/articles/the-commodities-feed-brent-risk-premium-builds-with-fears-of-re-escalation/", "summary": "Brent +4% to just above $113/bbl on fears of renewed US-Iran escalation (reported strike consideration, second carrier, troop evacuations). ING's 4Q26 $80 average now looks unattainable; re-escalation seen as most likely path. TTF above EUR90/MWh (highest since Dec 2022); LNG largely absent this winter. Gold -2.8% toward $4,000 on inflation/policy worries; copper down on rising inventories and AI-stock selloff.", "story_ids": ["oil-iran", "usd-rates-ai"]}, {"date": "2026-10-26", "title": "October ECB cheat sheet: French malaise shouldn't prompt a dovish turn", "url": "https://think.ing.com/articles/october-ecb-cheat-sheet-french-malaise-shouldnt-prompt-a-dovish-turn/", "summary": "ECB expected to hold at 2.5% on 29 Oct and keep the door open for a December hike, with a neutral, balanced message; a hike this week is priced near zero. Markets look for signs the French turmoil has triggered a dovish rethink - ING says not yet. EUR undervalued 1-1.5% vs short-term fair value; balance of risks still to the downside, but baseline is a broadly stable euro. ING preference: EUR/USD back to 1.120-1.130 in coming weeks. A surprise hike would risk a broader risk-off move, wider OAT spreads, lower equities and even lower Bund yields.", "id": "ecb-cheat-sheet", "story_ids": ["france-ecb", "usd-rates-ai"]}, {"date": "2026-10-27", "title": "FX Daily: Dollar buying returns ahead of FOMC", "url": "https://think.ing.com/articles/fx-daily-dollar-buying-returns-ahead-of-fomc/", "summary": "Dollar firmer at the start of the week as AI-related sentiment stabilises and markets position ahead of the FOMC; Chair Kevin Warsh reiterating inflation commitments reinforces the structural dollar floor. ING expects a broadly supported dollar this week. US consumer confidence seen at 81.5 (consensus 81.0) after 81.9 in September - soft data could dent hike pricing. Israeli election is tight; both Netanyahu and Eisenkot blocs short of a majority, Eisenkot marginally more diplomatic on Iran. RBNZ expected to deliver a hawkish 25bp hike; NZD/USD 0.570 4Q forecast. CEE rates reconnecting with higher energy prices; CEE FX downside risk exceeds upside.", "id": "fx-daily-dollar-buying", "story_ids": ["usd-rates-ai", "oil-iran"]}, {"date": "2026-10-26", "title": "Rates Spark: Temporary relief for structural problems", "url": "https://think.ing.com/articles/rates-spark-temporary-relief-for-structural-problems/", "summary": "Moody's kept France at double-A (negative outlook), so the 10y OAT-Bund spread narrowed more than 10bp to below 155bp after being at its widest since 2011. Relief only - France still needs a significant, sustained fiscal effort, politics stay fragmented, elections are in April 2027, and a tail risk is support for Melenchon. For the ECB, the retightening removes some pressure to hike and lets officials keep constructive ambiguity. Elevated energy and resilient data outside France keep hawkish pressure on front-end rates.", "id": "rates-spark-relief", "story_ids": ["france-ecb", "usd-rates-ai"]}, {"date": "2026-10-29", "title": "FX Daily: Can France wake up the ECB doves?", "url": "https://think.ing.com/articles/fx-daily-can-france-wake-up-ecb-doves/", "summary": "The softish dollar reaction to the Fed should not be over-read: the message stayed hawkish, a December hike is still 21bp priced and the bar to price it out is high. ING looked for core PCE at 0.3% MoM and 3Q GDP at 3.4% annualised, both dollar-positive, with DXY consolidating near the top of its range. On the ECB, the baseline was a neutral hold: not 'likely' to hike in December but 'possible/in play', with EUR/USD refusing to break 1.110. BoC hiked to 2.50% with more to come in 1Q27 and USD/CAD targeted at 1.420; the CNB looks set to go to 4.00% next week, and TTF above EUR100 keeps ING bearish on CEE currencies.", "story_ids": ["france-ecb", "usd-rates-ai"], "id": "fx-daily-ecb-doves"}, {"date": "2026-10-28", "title": "Fed holds rates steady despite inflation being too high", "url": "https://think.ing.com/articles/fed-holds-rates-steady-despite-inflation-being-too-high/", "summary": "The FOMC held at 3.75-4.00% on a 10-2 vote, with Hammack and Cook dissenting for a hike (Cook's vote was the surprise given her centrist record). The statement kept 'inflation remains elevated' and 'expanding at a strong pace' with no pre-commitment; Warsh offered no guidance beyond promising price stability 'no ifs, ands or buts'. A December hike to 4.00-4.25% stays ING's call, with two payroll reports and a CPI print before the decision. ING expects US inflation back at 2% in 2H27, a prolonged pause through 2027 and the December 2026 hike reversed in December 2027; from September one FOMC meeting a year will carry no rate vote, two from 2028.", "story_ids": ["usd-rates-ai"], "id": "fed-holds-10-2"}, {"date": "2026-10-28", "title": "Rates Spark: Leaning hawkish, but no action", "url": "https://think.ing.com/articles/rates-spark-leaning-hawkish-but-no-action/", "summary": "The hawkish lean was enough to validate the 10y back above 5%; there was barely a word in the statement that did not lean hawkish, yet no hike. Warsh's comforting line on inflation expectations pulled yields back to 5%, but expectations actually rose after the decision, and ING maintains the journey toward 5.25% while the front end likes the hold, steepening the curve from both ends. Balance-sheet run-off stays a Warsh objective but is not imminent; repo liquidity is stable. For the ECB, 23bp of December tightening is already priced, so the France questions at the press conference mattered more than the decision, with a high hurdle for a QT pause or TPI.", "story_ids": ["usd-rates-ai", "france-ecb"], "id": "rates-spark-hawkish-lean"}, {"date": "2026-10-28", "title": "FX Daily: Abatement in AI risk helps the dollar", "url": "https://think.ing.com/articles/fx-daily-abatement-in-ai-risk-helps-the-dollar/", "summary": "SK Hynix delivered strong earnings and Nasdaq futures added 0.6%, easing the AI-credit fear that had been the main threat to the bullish dollar story, so FX attention went back to energy, inflation and central banks. DXY is edging to the year's highs, where 102.50 opens 103.00. EUR/USD sits at the year's lows with 1.1065/1.1110 key support and 1.0880 the technical target below it, and the ECB bank lending survey showed tighter conditions plus an unexpected fall in corporate loan demand. A 20bp gilt risk premium could partly unwind on a boring UK budget, keeping EUR/GBP heavy toward 0.8315, and the BoC call was a coin flip.", "story_ids": ["usd-rates-ai", "france-ecb"], "id": "fx-daily-ai-risk-abates"}, {"date": "2026-10-29", "title": "The Commodities Feed: European gas tops EUR100 as supply fears grow", "url": "https://think.ing.com/articles/the-commodities-feed-european-gas-breaks-above-eur100-mwh-as-supply-fears-grow291026/", "summary": "TTF settled 4.85% higher and broke above EUR100/MWh for the first time since 2022, with little sign of relief in Persian Gulf LNG flows. QatarEnergy has extended force majeure for several buyers to the end of the year, Norwegian unplanned outages add supply risk and northwest Europe faces colder-than-usual weather from next week, with EU storage just under 75% and winter draws still ahead. Demand destruction is starting: power is deep into gas-to-coal switching and Yara has curtailed European ammonia, cutting its European gas use more than 7% YoY in 3Q26. Funds added 14.3TWh to their TTF net long, taking it to 207.4TWh.", "story_ids": ["oil-iran"], "id": "commodities-gas-100"}, {"date": "2026-10-28", "title": "The Commodities Feed: Oil in wait-and-see mode ahead of US midterms", "url": "https://think.ing.com/articles/the-commodities-feed-oil-market-in-wait-and-see-mode281026/", "summary": "Crude fell for a second day with Brent still around $114, as the market waits for clarity on Trump's next move on Iran and will likely stay in wait-and-see until after the 3 November midterms. A US-Iran deal is not needed for prices to fall: simply getting past the elections without renewed strikes could start eroding the risk premium. Products are loosening - Russia lifted its diesel export ban and the ICE gasoil crack slid toward $70, its lowest since early October - and there are tentative signs of Russia-Ukraine diplomacy. API showed US crude stocks down about 2m barrels; gold recovered above $4,000, copper tightened on a record Yangshan premium and LME backwardation, while iron ore hit a two-year low.", "story_ids": ["oil-iran", "usd-rates-ai"], "id": "commodities-oil-wait-see"}, {"date": "2026-10-28", "title": "RBNZ's huge dovish surprise spells trouble for Kiwi dollar", "url": "https://think.ing.com/articles/rbnzs-huge-dovish-surprise-spells-trouble-for-kiwi-dollar/", "summary": "The RBNZ held at 2.75% on a 4-3 vote when markets priced 23bp of hikes, and NZD fell 1.4%; the dovish bloc, including Governor Breman, argued 3Q inflation was lower than expected and that growth risks dominate. With inflation set to break above 4% in 4Q26, a December hold would leave the real policy rate at -1.4%. ING still expects a hike in December (22bp priced) and at least one more in 1Q27, and sees pricing beyond that as too aggressive (60bp by March, 100bp by August 2027). NZD outperformance is dropped: year-end NZD/USD stays 0.570 but with downside risk, and AUD/NZD above 1.260 looks imminent after a hot Australian CPI.", "story_ids": ["usd-rates-ai"], "id": "rbnz-dovish-hold"}, {"date": "2026-10-28", "title": "Bank of Canada likely to hike again after today's move", "url": "https://think.ing.com/articles/bank-of-canada-likely-to-hike-again-after-todays-move/", "summary": "The BoC raised its overnight rate 25bp to 2.50% with about 80% priced and economists split; it justified the move with stronger-than-expected growth, solid consumer spending, rebounding oil-and-gas capex and sectors hit by US tariffs strengthening, while unemployment has risen to 6.5%. Cost pass-through could become a 2027 theme, so there 'could be the need to increase the policy rate further', but the BoC will 'proceed carefully'. ING targets 2.75% in 1Q27 (January preferred) with a December hike as the risk, and judges the 90bp of tightening priced over 12 months as too hawkish. CAD stays oil-dependent with a 1.420 year-end USD/CAD target.", "story_ids": ["usd-rates-ai"], "id": "boc-hike-250"}, {"date": "2026-10-27", "title": "Rates Spark: Kevin Warsh and John Healey walk into a bar", "url": "https://think.ing.com/articles/rates-spark-kevin-warsh-and-john-healey-walk-into-a-bar/", "summary": "About 20bp of risk premium sits in the 10y gilt ahead of the Autumn Budget, versus near zero a few months ago, and a boring budget could unwind most of it after gilts held up well in the pre-budget auctions. Global factors still drive sterling rates, and an early election would be the next surprise. In the US, the 10y had been clinging to 4.99% waiting to tick the FOMC off before deviating from 5%, and ING expects it to snap back above 5% on inflation, the deficit and the AI boom; a super-hawkish Warsh without a hike would tempt that, a super-dovish one would validate the break below. Balance-sheet shrinkage plans are expected nearer the turn of the year.", "story_ids": ["usd-rates-ai", "france-ecb"], "id": "rates-spark-gilts-warsh"}, {"date": "2026-10-29", "title": "ECB keeps rates on hold as Christine Lagarde announced her resignation", "url": "https://think.ing.com/snaps/ecb-keeps-rates-on-hold-as-christine-lagarde-announced-her-resignation/", "summary": "The ECB left rates unchanged because higher headline inflation is showing few knock-on effects while bond yields have already made financing conditions more restrictive - the bond market has taken over the ECB's job. The news came hours earlier: Lagarde announced she will step down on 7 February 2027. France dominates the TPI debate, because the instrument requires compliance with the EU fiscal framework and that is hard to argue for France today; ING hopes the ECB remembers March 2020, when saying it was not there to narrow spreads backfired. (Snap: filed outside the three tracked sections.)", "story_ids": ["france-ecb"], "id": "ecb-holds-lagarde-out"}, {"date": "2026-10-29", "title": "Lagarde's comments point to a December ECB rate hike", "url": "https://think.ing.com/articles/lagarde-comments-point-to-december-ecb-rate-hike/", "summary": "Rates on hold and Lagarde out is the headline, but the nuance is that the ECB still looks set to hike in December despite growing stagflationary pressures: it debated a hike today and the worsening of financing conditions took it off the table. Lagarde called growth risks tilted to the downside and inflation risks to the upside, saw no second-round effects beyond the September projections, and flagged two developments since September - higher energy prices and tighter financing conditions. ING's three parameters are the length of the Middle East war, the pass-through of energy into the rest of the economy, and French contagion.", "story_ids": ["france-ecb", "usd-rates-ai"], "id": "lagarde-december-hike"}, {"date": "2026-10-29", "title": "Eurozone sentiment weakens in October as price expectations tick up", "url": "https://think.ing.com/snaps/eurozone-sentiment-weakened-in-october-as-price-expectations-tick-up/", "summary": "The eurozone Economic Sentiment Indicator fell to 96.9 from 97.5, the weakest since June, with employment expectations up slightly. Industry actually improved - production, orders and hiring intentions all firmer - while services were more downbeat on demand but more optimistic on the months ahead; consumers are shying away from major purchases. The ECB-relevant detail is that both industry and services expect stronger price increases ahead, especially for goods. No immediate need to hike, but no room to sound dovish either. (Snap: filed outside the three tracked sections.)", "story_ids": ["france-ecb"], "id": "ez-sentiment-oct"}, {"date": "2026-10-29", "title": "ING webinar on the 2027 rates outlook: The Good, the Bad, and the Ugly", "url": "https://think.ing.com/articles/webinar-the-good-the-bad-and-the-ugly-for-rates-in-2027/", "summary": "ING's 2027 rates webinar (4 November, 1400 GMT) frames the debate rather than taking a view: whether the US 10y can reach 6% on AI and productivity, extraordinary deficits and stubborn inflation, what Treasury Secretary Bessent could do if yields surge, and whether the eurozone's inflation shock is changing rather than fading. It also asks how second-round effects, heavy bond supply and rising global real rates complicate the ECB's path even if it turns more dovish, with France's debt challenge as the extra sovereign uncertainty. Useful as the agenda for what to watch into year-end.", "story_ids": ["usd-rates-ai", "france-ecb"], "id": "webinar-2027-rates"}, {"date": "2026-10-30", "title": "A strong economy may not be enough to sway Spain's election", "url": "https://think.ing.com/articles/spains-strong-economy-may-not-decide-the-election/", "summary": "Spain's 29 November election has been overshadowed by a fatal high-speed rail collision near Urda in Toledo province that killed at least 69 people and led most parties to suspend campaigning, putting rail safety and public services into the debate alongside corruption cases touching the Socialists. The economy is still outperforming - 3Q GDP rose 0.6% QoQ and 2.7% YoY, well above most large eurozone peers - but unemployment climbed from 9.87% to 10.18% as the labour force grew 169,500 against 73,600 new jobs, harmonised inflation held at 4.9% and retail sales fell 1.4% YoY in September. The People's Party leads the polls and could reach a majority with Vox; Feijoo promises one million homes and a new Land Law within 100 days, against Socialist rent limits and eviction protection, while Spain added ~1.22m households between 2021 and 2025 but completed only ~466,000 homes. ING sees limited near-term macro impact - the energy shock and monetary tightening matter more - but a fragmented parliament would prolong the budget extensions and legislative paralysis.", "story_ids": ["france-ecb"], "id": "spain-election-economy"}, {"date": "2026-10-30", "title": "FX Daily: Time to think about the midterms?", "url": "https://think.ing.com/articles/fx-daily-time-to-think-about-the-midterms/", "summary": "Fresh pressure on tech stocks drove safe-haven demand into Treasuries and weighed on the dollar, and ING sees precautionary unwinding of net-long dollar positions as the main risk into Tuesday's midterms, with a Democratic sweep around 68% in prediction markets read as mildly dollar-negative through shutdown and debt-ceiling gridlock. Thursday's US data leaned hawkish - 3Q growth 3.4% and September core PCE 0.3% MoM - and the FOMC blackout ends with Barkin (neutral), Daly (moderate dove) and Musalem (moderate hawk), though ING doubts they can add much with a December hike priced. Lagarde said a hike was discussed, gave no indication French bonds prompt a dovish rethink and officials are 'ready' to raise in December, leaving room for EUR/USD to re-test 1.120-1.1250; ING expects eurozone 3Q GDP at 0.3% QoQ but only 0% in France against 0.1% consensus, and a negative French print would widen spreads. The BoJ held at 1.25% and flagged its 2% target as met, with ING now looking for hikes in December and March/April and USD/JPY holding a 155-160 range.", "story_ids": ["usd-rates-ai", "france-ecb"], "id": "fx-daily-midterms"}, {"date": "2026-10-30", "title": "Bank of Japan hits 2% price target", "url": "https://think.ing.com/articles/bank-of-japan-2-price-target-hit/", "summary": "The BoJ left the policy rate at 1.25% - back-to-back hikes would have upset markets - but said for the first time that underlying CPI is 'generally consistent' with the 2% target set in 2013, so the debate shifts to how fast it reaches a 1.75-2.00% neutral rate. Energy prices, AI demand and the weak yen were all named as upside inflation risks, growth forecasts were held around 0.7-0.8%, CPI forecasts were nudged higher and the BoJ acknowledged overseas rate rises, with an implicit fear that not matching December hikes from the Fed and ECB would leave the yen vulnerable. ING now expects 25bp hikes in December and March, a 1.75% policy rate ahead of April consumption support, and an acceleration of ETF sales from JPY330bn to JPY860bn a year from 2027. USD/JPY stays bid toward the top of 155-160 until a decisive turn lower in 2Q27, with a USD/KRW-style AI-driven upside surprise the one to watch in 2027.", "story_ids": ["usd-rates-ai"], "id": "boj-2pct-target"}, {"date": "2026-10-29", "title": "Rates Spark: Hikes coming, but bond yields choosing to fall", "url": "https://think.ing.com/articles/rates-spark-hikes-coming-but-bond-yields-choosing-to-fall/", "summary": "The US 10y made a decisive gap away from 5%, but to the downside, even though September core PCE rose to 3.1% - far from the 2% Warsh keeps restating - and income, spending and jobless claims all came in firm; the 7yr auction cleared with no tail and decent demand, and the move was more a back-end than front-end story. ING reads it as Treasuries staying responsive to AI-valuation sentiment and equity wobbles rather than fundamentals, calls it contrary to its preferred path back to higher yields but not enough to change its tune. On the ECB, a December hike looks near-certain with more than 20bp priced unless the Middle East improves or French bonds deteriorate, and a Reuters report that ECB staff see higher yields cutting 2027-28 growth by 100bp and inflation by 90bp supports ING's view that December could be the last hike of the cycle. Market pricing for further ECB tightening over 12 months has already fallen toward 65bp, driven mainly by French risk-off and more recently AI jitters, while Friday brings French, Spanish and German CPI plus eurozone 3Q GDP.", "story_ids": ["usd-rates-ai", "france-ecb"], "id": "rates-spark-hikes-yields-fall"}, {"date": "2026-11-02", "title": "FX Daily: Dollar holds gains into midterms", "url": "https://think.ing.com/articles/fx-daily-dollar-holds-gains-into-midterms/", "summary": "The dollar was fractionally lower to start the week, tracking oil 2-3% lower on reports that Trump wants to let diplomacy run its course with Iran, while betting sites give the Democrats a 70-72% chance of taking both chambers in Tuesday's midterms - an outcome ING calls mildly dollar-negative on debt-ceiling gridlock and a prolonged shutdown next year, but largely speculative against 3Q growth of 3.4%, a sixth consecutive year of above-target inflation and a Fed readying another hike. DXY should keep trading around 102.00 with no strong case for a correction lower, with ISM surveys and Friday's October payrolls mattering less than price data barring a disastrous report. The 9% Nasdaq sell-off last month has softened short-dated US rates and a further tech slide is the biggest risk to long dollar positioning, with Apple reporting after today's close. Fitch's unscheduled late-Friday move of France's A+ outlook to negative, with another review promised by end-February, should cap EUR/USD rebounds - sellers are suspected in the 1.1200/1.1250 area - and keep EUR/CHF pressed toward 0.9180/85; a 25bp BoE hike to 4.00% on Thursday looks fully priced, the CNB is set to hike 25bp to 4.00%, and the NBP is expected to hold at 3.75% with no hike before 1Q27.", "story_ids": ["usd-rates-ai", "france-ecb", "oil-iran"], "id": "fx-daily-dollar-midterms"}, {"date": "2026-11-02", "title": "The Commodities Feed cond-round effects in sight, even a December hike might not yet be a done deal. (Snap: filed outside the three tracked sections.)", "story_ids": ["france-ecb"], "id": "german-inflation-oct"}, {"date": "2026-10-30", "title": "Riksbank to hike despite soft inflation and rallying krona", "url": "https://think.ing.com/articles/riksbank-to-hike-despite-soft-inflation-and-rallying-krona/", "summary": "The Riksbank is expected to hike 25bp to 2.00% on 4 November even though market bets have slipped from 22-24bp to 15-18bp, with officials' in-meeting and off-meeting commentary endorsing a move and the energy shock outweighing September's soft print and the stronger krona; no explicit commitment to more should follow, but the tightening bias stays. CPIF came in at 1.5% YoY as expected while CPIF excluding energy was just 0.5%, 0.2ppt below the Riksbank's forecast, though goods inflation was broad-based with durable prices up 1.1% month-on-month; ING keeps CPIF at 2.5% in December and expects a further hike to 2.25% on 3 February, after which the risks are hawkish. Brent is $118 against the $92 end-2026 assumption from September and European gas is up around 35%, while the krona is only 1.4% stronger on a trade-weighted basis and still 4% weaker year-to-date, so a hold would invite fresh SEK weakness. ING cuts its year-end EUR/SEK target to 11.00 from 11.10-11.15, sees a possible break below 10.90 in the coming week and a gradual slide to 10.70 over the next year.", "story_ids": ["usd-rates-ai", "france-ecb"], "id": "riksbank-nov-hike"}], "stories": [{"id": "france-ecb", "name": "French fiscal crisis and the ECB", "category": "Europe", "updated": "2026-11-02", "summary": "German October inflation fell to 2.8% YoY from 3.3% with core at 2.1% from 2.4%, services also lower and no second-round effects from energy at state level, which ING says comforts the ECB doves - even a December hike may not be a done deal - though it still expects headline back above 3% into late 2026 and ate": "2026-10-27", "text": "ECB: the 29 Oct meeting is now framed as a hold at 2.5% with the door open for December, not a debate about hiking now. Baseline is a neutral message and a broadly stable euro, with EUR/USD targeted at 1.120-1.130."}, {"date": "2026-10-27", "text": "USD: the narrative flipped this week. Last week the dollar had 'lost its safe-haven crown'; now stabilising AI sentiment and pre-FOMC positioning have brought dollar buying back. Hawkish-Fed scenario raised 25% -> 30%, AI risk-off cut 25% -> 22%."}, {"date": "2026-10-27", "text": "Oil: no new commodity note, but the Israeli election is a fresh de-escalation channel (Eisenkot softer on Iran than Netanyahu). De-escalation 15% -> 18%, re-escalation 38% -> 36%, supply outage 7% -> 6%."}, {"date": "2026-10-27", "text": "Removed the 'EM and CEE FX under pressure' story at your request. The source detail (MXN, PLN, HUF, RON) is still recorded inside the papers, and ING still flags CEE FX downside risk in this week's FX Daily."}, {"date": "2026-10-27", "text": "Still open: FOMC tomorrow, ECB on 29 Oct, RBNZ (hawkish 25bp expected), US consumer confidence today."}, {"date": "2026-10-29", "text": "Fed held at 3.75-4.00% on a 10-2 vote: Hammack and Cook dissented for a hike, and Warsh promised price stability 'no ifs, ands or buts' without pre-committing to December. A hike to 4.00-4.25% stays ING's call with 21bp priced. Hawkish-Fed scenario raised 30% -> 34%, choppy base cut 43% -> 41%."}, {"date": "2026-10-29", "text": "The AI risk-off impulse faded: SK Hynix beat, Nasdaq futures added 0.6% and Alphabet/Microsoft reported next. AI-led risk-off and growth scare cut 22% -> 20%."}, {"date": "2026-10-29", "text": "ECB held on 29 Oct as expected. Lagarde framed it as the bond market taking over the ECB's job, saw growth risks to the downside and inflation risks to the upside, and still pointed to a December hike."}, {"date": "2026-10-29", "text": "Christine Lagarde announced she will step down on 7 February 2027 - a snap filed outside the three tracked sections, picked up by the macro layer. Contagion/ECB-backstop raised 20% -> 22%, disorderly raised 5% -> 6%, contained stress cut 62% -> 60%, French relief cut 13% -> 12%."}, {"date": "2026-10-29", "text": "Oil: Brent around $114 and lower for a second day into the 3 November midterms; Russia lifted its diesel export ban and the ICE gasoil crack fell to ~$70. De-escalation raised 18% -> 22%, re-escalation cut 36% -> 32%."}, {"date": "2026-10-29", "text": "Gas: TTF settled above EUR100/MWh for the first time since 2022 (+4.85%) on extended Qatari force majeure, Norwegian outages and colder weather; EU storage just under 75%. Elevated-premium scenario held at 40%."}, {"date": "2026-10-29", "text": "Eurozone sentiment fell to 96.9 from 97.5, but industry and services both expect stronger price increases ahead, so no hike is needed now and no dovish turn is available either."}, {"date": "2026-10-29", "text": "RBNZ held at 2.75% on a 4-3 vote and NZD fell 1.4%; BoC hiked 25bp to 2.50% with ING seeing a 2.75% peak in 1Q27. USD/CAD keeps a 1.420 year-end target and markets look too hawkish on both."}, {"date": "2026-10-29", "text": "Still open: BoJ on 30 Oct, US midterms 3 November, ING 2027 rates webinar 4 November, and payrolls plus CPI before the 9 December FOMC. UK Autumn Budget gilt reaction also pending."}, {"date": "2026-10-30", "text": "Rates Spark: the US 10y gapped decisively away from 5% to the downside even though September core PCE rose to 3.1% and income, spending and claims were firm; the 7yr auction cleared with no tail and the move was concentrated at the back end. ING keeps its 5.25% call. Hawkish-Fed scenario cut 34% -> 32%."}, {"date": "2026-10-30", "text": "AI sentiment is the marginal driver of Treasuries and the dollar again: fresh pressure on tech stocks brought haven flows, and a Democratic sweep is ~68% priced for the 3 November midterms, which ING reads as mildly dollar-negative and a reason not to chase USD upside. AI-led risk-off and growth scare raised 20% -> 24%, choppy base cut 41% -> 39% as the 10y left 5% behind."}, {"date": "2026-10-30", "text": "ECB: Lagarde confirmed a hike was discussed, gave no sign French bonds prompt a dovish rethink and officials are 'ready' to raise in December with 20bp+ priced; a Reuters report has ECB staff estimating higher yields cut 2027-28 growth by 100bp and inflation by 90bp, keeping December as the likely last hike of the cycle. Contained-grinding-stress raised 60% -> 61%, French relief cut 12% -> 11%."}, {"date": "2026-10-30", "text": "BoJ held at 1.25% but for the first time judged underlying CPI consistent with the 2% target, naming energy, AI demand and the weak yen as upside risks. ING now expects 25bp hikes in December and March, a 1.75% policy rate by April and ETF sales accelerated to JPY860bn a year from 2027, with USD/JPY bid in 155-160 until a 2Q27 turn lower."}, {"date": "2026-10-30", "text": "Spain's 29 November election is a close race with the PP ahead and a PP-Vox majority possible; 3Q GDP grew 0.6% QoQ and 2.7% YoY but unemployment rose to 10.18% and harmonised inflation held at 4.9%, and ING sees little immediate macro impact. Filed under the france-ecb story as eurozone political risk; no probability change."}, {"date": "2026-10-30", "text": "No commodities paper in this batch, so oil-iran weights are unchanged: Brent near $114 and TTF above EUR100 still hold the premium, with renewed speculation about US strikes on Iran offset by looser product markets and the lifted Russian diesel ban."}, {"date": "2026-10-30", "text": "Still open: US midterms 3 November, Spain's election 29 November, eurozone flash CPI and 3Q GDP (France 0% expected against 0.1% consensus, a negative print would widen spreads), ING's 2027 rates webinar 4 November, Lagarde's successor announcement (de Cos dove vs Knot hawk), BoJ hikes in December and March, and payrolls plus CPI before the 9 December FOMC."}, {"date": "2026-11-02", "text": "FX Daily: Democrats are 70-72% priced to take both chambers on 3 November, which ING calls mildly dollar-negative but speculative against 3Q growth of 3.4%, a sixth year of above-target inflation and a Fed readying another hike, with DXY holding around 102.00 and no case for a correction lower. The bigger risk to long-dollar positioning is the tech sell-off - Nasdaq fell 9% last month, Apple reports tonight and gold slid 3.65% to a one-year low of $3,874.62/oz as investors raise cash. AI-led risk-off and growth scare raised 24% -> 25%, choppy base cut 39% -> 38%."}, {"date": "2026-11-02", "text": "Fitch moved its outlook on France's A+ sovereign rating from stable to negative in an unscheduled review late Friday and promised another review by end-February, citing the failure to repair public finances in weak growth; ING sees it capping EUR/USD rebounds (sellers suspected at 1.1200/1.1250) and keeping EUR/CHF pressed toward 0.9180/85. Contained-grinding-stress raised 61% -> 62%, French relief cut 11% -> 10%."}, {"date": "2026-11-02", "text": "German inflation snap (macro layer): headline fell to 2.8% YoY in October from 3.3% and core to 2.1% from 2.4%, with services lower, household energy down MoM on the fuel tax rebate and no indirect energy effects at state level; ING still sees headline back above 3% into early 2027 and says even a December ECB hike may not be a done deal. The dovish comfort is offset by the Fitch move, so contagion/ECB-backstop stays at 22% and disorderly at 6%."}, {"date": "2026-11-02", "text": "Commodities Feed: Brent settled 2.4% higher on Friday just above $113 (Dec-26 expiry $117.64) but is down 2-3% today on reports Trump wants to let diplomacy with Iran run, with Iranian negotiators in Doha; Ukrainian attacks on Russian refineries resumed after a two-week pause, Russia plans 2.15m t of November diesel exports against 500kt in October and OPEC+ kept December targets unchanged. De-escalation raised 22% -> 23%, re-escalation cut <script>
const S=JSON.parse(document.getElementById('data').textContent);
const COL={base:'var(--base)',bull:'var(--bull)',bear:'var(--bear)',tail:'var(--tail)'};
const LBL={base:'Base case',bull:'Upside',bear:'Downside',tail:'Tail risk'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let view='stories',cat='All';
const shift=sc=>{const h=sc.history||[];return h.length>1?h[h.length-1].probability-h[h.length-2].probability:null};
function chart(st){
 const series=st.scenarios.map(sc=>({sc,h:sc.history||[]})).filter(x=>x.h.length);
 if(!series.length)return'';
 const dates=[...new Set(series.flatMap(x=>x.h.map(p=>p.date)))].sort();
 const W=600,H=150,P=24,x=d=>dates.length>1?P+(W-2*P)*dates.indexOf(d)/(dates.length-1):W/2,y=v=>H-P-(H-2*P)*v/100;
 let g=[0,50,100].map(v=>`<line x1="${P}" x2="${W-P}" y1="${y(v)}" y2="${y(v)}" stroke="#2b3542"/><text x="2" y="${y(v)+4}" fill="#8b97a7" font-size="10">${v}</text>`).join('');
 g+=dates.map(d=>`<text x="${x(d)}" y="${H-6}" fill="#8b97a7" font-size="10" text-anchor="middle">${esc(d.slice(5))}</text>`).join('');
 for(const {sc,h} of series){const c={base:'#4a90e2',bull:'#2ecc71',bear:'#e74c3c',tail:'#a56cf0'}[sc.type]||'#ccc';
  g+=`<polyline fill="none" stroke="${c}" stroke-width="2" points="${h.map(p=>x(p.date)+','+y(p.probability)).join(' ')}"/>`+h.map(p=>`<circle cx="${x(p.date)}" cy="${y(p.probability)}" r="3" fill="${c}"><title>${esc(sc.name)} ${p.probability}% (${esc(p.date)}) ${esc(p.note)}</title></circle>`).join('')}
 return `<svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="legend">${series.map(({sc})=>`<span style="--c:${COL[sc.type]||'#ccc'}"><i></i>${esc(sc.name)}</span>`).join('')}</div>`}
function scCard(sc){const d=shift(sc);
 return `<div class="sc" style="--c:${COL[sc.type]||'#888'}"><div class="t">${LBL[sc.type]||''}</div><h3>${esc(sc.name)}</h3>
 <div class="pr">${sc.probability}%${d!==null?`<small class="${d>=0?'up':'dn'}">${d>=0?'▲':'▼'} ${Math.abs(d)}</small>`:''}</div>
 <div class="bar"><i style="width:${sc.probability}%"></i></div><p>${esc(sc.description)}</p>
 ${(sc.triggers||[]).length?`<p><b>Watch:</b> ${sc.triggers.map(esc).join('; ')}</p>`:''}
 ${sc.fx_impact?`<p><b>FX impact:</b> ${esc(sc.fx_impact)}</p>`:''}</div>`}
function stories(){
 if(!S.stories.length)return'<div class="empty">No stories yet. Paste ING articles in the chat to populate this dashboard.</div>';
 const cats=['All',...new Set(S.stories.map(s=>s.category).filter(Boolean))];
 const list=S.stories.filter(s=>cat==='All'||s.category===cat);
 return `<div class="filters">${cats.map(c=>`<span class="chip ${c===cat?'on':''}" onclick="cat='${esc(c)}';render()">${esc(c)}</span>`).join('')}</div>`+
 list.map(s=>`<section class="story"><h2>${esc(s.name)}</h2><div class="mut">${esc(s.category)} · updated ${esc(s.updated)}</div>
 <p>${esc(s.summary)}</p>${(s.pairs||[]).map(p=>`<span class="tag">${esc(p)}</span>`).join('')}
 <div class="scs">${s.scenarios.map(scCard).join('')}</div>${chart(s)}</section>`).join('')}
function papers(){return S.papers.length?[...S.papers].sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<details><summary>${esc(p.date)} – ${esc(p.title)}</summary><p>${esc(p.summary)}</p>${p.url?`<p><a href="${esc(p.url)}" target="_blank" rel="noopener">Source</a></p>`:''}<div class="mut">Stories: ${(p.story_ids||[]).map(esc).join(', ')}</div></details>`).join(''):'<div class="empty">No papers yet.</div>'}
function changes(){return S.changelog.length?[...S.changelog].sort((a,b)=>b.date.localeCompare(a.date)).map(c=>`<div class="log"><b>${esc(c.date)}</b> – ${esc(c.text)}</div>`).join(''):'<div class="empty">No changes logged yet.</div>'}
function render(){
 document.getElementById('meta').textContent=`${S.papers.length} papers · ${S.stories.length} stories`;
 const V={stories:'Stories & scenarios',papers:'Papers',changes:'What changed'};
 document.getElementById('nav').innerHTML=Object.entries(V).map(([k,v])=>`<button class="${k===view?'on':''}" onclick="view='${k}';render()">${v}</button>`).join('');
 document.getElementById('main').innerHTML={stories,papers,changes}[view]()}
render();
</script></body></html>

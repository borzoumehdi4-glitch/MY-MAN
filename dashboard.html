<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ING Macro Scenarios</title>
<style>
:root{--bg:#0f1419;--card:#1a212b;--line:#2b3542;--tx:#e6e9ee;--mut:#8b97a7;--base:#4a90e2;--bull:#2ecc71;--bear:#e74c3c;--tail:#a56cf0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif}
header{padding:18px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
h1{margin:0;font-size:20px}.mut{color:var(--mut);font-size:13px}
nav{display:flex;gap:6px}nav button{background:var(--card);color:var(--tx);border:1px solid var(--line);padding:7px 14px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--base);border-color:var(--base)}
main{padding:24px 28px;max-width:1400px;margin:auto}
.filters{margin-bottom:16px;display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:12px;border:1px solid var(--line);cursor:pointer;font-size:13px;background:var(--card)}.chip.on{background:var(--tx);color:var(--bg)}
.story{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:22px}
.story h2{margin:0 0 2px;font-size:18px}.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--line);margin:0 4px 4px 0}
.scs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}
.sc{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:8px;padding:12px;background:#151b23}
.sc h3{margin:0;font-size:15px}.sc .t{color:var(--c);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.pr{font-size:28px;font-weight:700;margin:4px 0}.up{color:var(--bull)}.dn{color:var(--bear)}.pr small{font-size:13px;margin-left:6px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}.bar i{display:block;height:100%;background:var(--c)}
.sc p{margin:6px 0;font-size:13.5px}.sc b{color:var(--mut);font-weight:600}
svg{width:100%;height:150px;margin-top:14px;background:#151b23;border-radius:8px}
.legend span{margin-right:14px;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;background:var(--c)}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px}summary{cursor:pointer;font-weight:600}
a{color:var(--base)}.log{padding:8px 0;border-bottom:1px solid var(--line)}
.empty{padding:40px;text-align:center;color:var(--mut)}
</style></head><body>
<header><div><h1>ING Macro Stories &amp; Scenarios</h1><div class="mut" id="meta"></div></div>
<nav id="nav"></nav></header>
<main id="main"></main>
<script id="data" type="application/json">{"papers": [{"id": "ecb-french-drama", "date": "2026-10-22", "title": "ECB caught in the French drama (Carsten Brzeski)", "url": "https://think.ing.com/articles/ecb-caught-in-the-french-drama/", "summary": "ECB expected on hold on 29 Oct. The jump in bond yields after the French crisis already tightens policy: German yields ~ a 25bp hike, France ~ 50bp. Next hike decision pushed to December (new projections). Path depends on Middle East war length, energy pass-through, and French contagion. Defences: dovish rates, flexible reinvestment (pause QT), then TPI, which is hard to justify while France is non-compliant with fiscal rules.", "story_ids": ["france-ecb", "oil-iran"]}, {"id": "fx-daily-safe-haven", "date": "2026-10-23", "title": "FX Daily: Dollar has lost its safe-haven crown", "url": "https://think.ing.com/articles/fx-daily-dollar-has-lost-its-safe-haven-crown/", "summary": "Equities sold off on oil and AI worries; JPY and CHF were the safe-haven winners, not USD. Bond/equity negative correlation is back. UST 10y below 5%, 2y SOFR swap -15bp to 4.50%, but the bar to price out a December Fed hike is high. OAT-Bund 10y at 174bp (peak 178bp); EUR sensitivity to France can return quickly. CEE hit by risk-off (PLN, HUF vulnerable; EUR/HUF capped 368-370). MXN -8% since early Sept; Banxico dovish; USD/MXN 19.00-19.10 trajectory.", "story_ids": ["usd-rates-ai", "france-ecb", "em-fx"]}, {"id": "rates-spark-5pct", "date": "2026-10-22", "title": "Rates Spark: US and France like ships passing in the night at 5%", "url": "https://think.ing.com/articles/rates-spark-us-and-france-like-ships-passing-in-the-night-at-5/", "summary": "UST 10y broke below 5% on risk-off; ING expects it to revert above 5% (inflation, deficits, AI boom, US midterms), timing uncertain. French 10y above 5%, spread ~175bp vs Germany. Moody's (Aa3 negative) downgrade looks overdue, no fixed release time. A lasting French relief needs a credible 2027 budget, possibly not before December. Weak PMIs could trigger a bullish rates repricing and a more dovish ECB.", "story_ids": ["usd-rates-ai", "france-ecb"]}, {"id": "commodities-brent", "date": "2026-10-23", "title": "The Commodities Feed: Brent builds geopolitical premium as Gulf risks rise", "url": "https://think.ing.com/articles/the-commodities-feed-brent-risk-premium-builds-with-fears-of-re-escalation/", "summary": "Brent +4% to just above $113/bbl on fears of renewed US-Iran escalation (reported strike consideration, second carrier, troop evacuations). ING's 4Q26 $80 average now looks unattainable; re-escalation seen as most likely path. TTF above EUR90/MWh (highest since Dec 2022); LNG largely absent this winter. Gold -2.8% toward $4,000 on inflation/policy worries; copper down on rising inventories and AI-stock selloff.", "story_ids": ["oil-iran", "usd-rates-ai"]}], "stories": [{"id": "france-ecb", "name": "French fiscal crisis and the ECB", "category": "Europe", "updated": "2026-10-23", "summary": "French yields above 5% and OAT-Bund spread at ~175bp are doing the ECB's tightening for it. ECB should hold on 29 Oct and hint dovishly; a Moody's downgrade is pending. The key question is whether this stays a French problem or spreads to the eurozone and forces ECB support (QT pause, then TPI).", "pairs": ["EURUSD", "EURCHF", "EURJPY", "EURGBP"], "paper_ids": ["ecb-french-drama", "fx-daily-safe-haven", "rates-spark-5pct"], "scenarios": [{"name": "Contained, grinding stress", "type": "base", "probability": 55, "description": "Spreads stay 150-180bp, Moody's downgrade is absorbed, ECB holds in Oct and stays cautious in Dec. No TPI.", "triggers": ["Moody's decision", "ECB 29 Oct tone", "OAT-Bund spread"], "fx_impact": "EUR range-bound with a downside skew; the EUR/France correlation spikes on bad days.", "history": [{"date": "2026-10-23", "probability": 55, "note": "Initial estimate (analyst judgement, not ING's)"}]}, {"name": "French relief", "type": "bull", "probability": 1 CAD/NOK supported; JPY and EUR pressured by terms of trade.", "history": [{"date": "2026-10-23", "probability": 40, "note": "Initial estimate (analyst judgement, not ING's)"}]}, {"name": "De-escalation", "type": "bull", "probability": 15, "description": "Diplomacy or the midterm effect calms tensions; the premium unwinds and Brent heads toward $90.", "triggers": ["Talks announced", "Carrier withdrawal"], "fx_impact": "Oil FX fades; EUR and JPY relief; lower hike pricing.", "history": [{"date": "2026-10-23", "probability": 15, "note": "Initial estimate (analyst judgement, not ING's)"}]}, {"name": "Re-escalation, flows threatened", "type": "bear", "probability": 38, "description": "US strikes on Iran and disruption risk; Brent above $120, gas spikes further.", "triggers": ["US strikes", "Hormuz incidents", "Troop evacuations"], "fx_impact": "USD mixed (haven demand weak); JPY/CHF and CAD/NOK strongest; EUR hit by energy.", "history": [{"date": "2026-10-23", "probability": 38, "note": "Initial estimate (analyst judgement, not ING's)"}]}, {"name": "Major supply outage", "type": "tail", "probability": 7, "description": "Actual loss of Gulf flows; Brent far above $130.", "triggers": ["Tanker attacks", "Facility damage"], "fx_impact": "Severe risk-off; CHF/JPY surge; EM FX sells off.", "history": [{"date": "2026-10-23", "probability": 7, "note": "Initial estimate (analyst judgement, not ING's)"}]}]}, {"id": "usd-rates-ai", "name": "US rates, Fed hike risk and AI-valuation wobble", "category": "US / Rates", "updated": "2026-10-23", "summary": "UST 10y slipped under 5% as AI worries and risk-off reasserted bond/equity inverse correlation. USD lost safe-haven status (JPY/CHF won). ING expects 10y to revert above 5%, and a December Fed hike is still not priced out. Gold falls on inflation/policy fears.", "pairs": ["USDJPY", "USDCHF", "EURUSD", "XAUUSD"], "paper_ids": ["fx-daily-safe-haven", "rates-spark-5pct", "commodities-brent"], "scenarios": [{"name": "Choppy around 5%, Dec RHUF", "EURRON"], "paper_ids": ["fx-daily-safe-haven"], "scenarios": [{"name": "Persistent weakness", "type": "base", "probability": 50, "description": "Banxico stays dovish on 5 Nov; USD/MXN 19.00-19.10; PLN/HUF drift weaker with energy.", "triggers": ["Banxico 5 Nov", "Oil", "Fed pricing"], "fx_impact": "USDMXN up, EURPLN up, EURHUF capped.", "history": [{"date": "2026-10-23", "probability": 50, "note": "Initial estimate (analyst judgement, not ING's)"}]}, {"name": "Relief rally", "type": "bull", "probability": 20, "description": "Banxico hawkish surprise or oil/risk calm.", "triggers": ["Banxico hawkish", "Lower oil"], "fx_impact": "MXN and CEE recover.", "history": [{"date": "2026-10-23", "probability": 20, "note": "Initial estimate (analyst judgement, not ING's)"}]}, {"name": "Deeper sell-off", "type": "bear", "probability": 25, "description": "Global risk-off and AI unrest, with Mexico's US-securities exposure adding outflows.", "triggers": ["Equity sell-off", "Oil spike"], "fx_impact": "USDMXN breaks higher; EURPLN up.", "history": [{"date": "2026-10-23", "probability": 25, "note": "Initial estimate (analyst judgement, not ING's)"}]}, {"name": "EM funding stress", "type": "tail", "probability": 5, "description": "Broad EM outflows.", "triggers": ["Spreads", "Dollar funding"], "fx_impact": "Sharp EM FX gaps.", "history": [{"date": "2026-10-23", "probability": 5, "note": "Initial estimate (analyst judgement, not ING's)"}]}]}], "changelog": [{"date": "2026-10-23", "text": "Batch 1: four ING articles (22-23 Oct 2026) analysed; four stories created. Probabilities are initial estimates."}]}</script>
<script>
const S=JSON.parse(document.getElementById('data').textContent);
const COL={base:'var(--base)',bull:'var(--bull)',bear:'var(--bear)',tail:'var(--tail)'};
const LBL={base:'Base case',bull:'Upside',bear:'Downside',tail:'Tail risk'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let view='stories',cat='All';
const shift=sc=>{const h=sc.history||[];return h.length>1?h[h.length-1].probability-h[h.length-2].probability:null};
function chart(st){
 const series=st.scenarios.map(sc=>({sc,h:sc.history||[]})).filter(x=>x.h.length);
 if(!series.length)return'';
 const dates=[...new Set(series.flatMap(x=>x.h.map(p=>p.date)))].sort();
 const W=600,H=150,P=24,x=d=>dates.length>1?P+(W-2*P)*dates.indexOf(d)/(dates.length-1):W/2,y=v=>H-P-(H-2*P)*v/100;
 let g=[0,50,100].map(v=>`<line x1="${P}" x2="${W-P}" y1="${y(v)}" y2="${y(v)}" stroke="#2b3542"/><text x="2" y="${y(v)+4}" fill="#8b97a7" font-size="10">${v}</text>`).join('');
 g+=dates.map(d=>`<text x="${x(d)}" y="${H-6}" fill="#8b97a7" font-size="10" text-anchor="middle">${esc(d.slice(5))}</text>`).join('');
 for(const {sc,h} of series){const c={base:'#4a90e2',bull:'#2ecc71',bear:'#e74c3c',tail:'#a56cf0'}[sc.type]||'#ccc';
  g+=`<polyline fill="none" stroke="${c}" stroke-width="2" points="${h.map(p=>x(p.date)+','+y(p.probability)).join(' ')}"/>`+h.map(p=>`<circle cx="${x(p.date)}" cy="${y(p.probability)}" r="3" fill="${c}"><title>${esc(sc.name)} ${p.probability}% (${esc(p.date)}) ${esc(p.note)}</title></circle>`).join('')}
 return `<svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="legend">${series.map(({sc})=>`<span style="--c:${COL[sc.type]||'#ccc'}"><i></i>${esc(sc.name)}</span>`).join('')}</div>`}
function scCard(sc){const d=shift(sc);
 return `<div class="sc" style="--c:${COL[sc.type]||'#888'}"><div class="t">${LBL[sc.type]||''}</div><h3>${esc(sc.name)}</h3>
 <div class="pr">${sc.probability}%${d!==null?`<small class="${d>=0?'up':'dn'}">${d>=0?'▲':'▼'} ${Math.abs(d)}</small>`:''}</div>
 <div class="bar"><i style="width:${sc.probability}%"></i></div><p>${esc(sc.description)}</p>
 ${(sc.triggers||[]).length?`<p><b>Watch:</b> ${sc.triggers.map(esc).join('; ')}</p>`:''}
 ${sc.fx_impact?`<p><b>FX impact:</b> ${esc(sc.fx_impact)}</p>`:''}</div>`}
function stories(){
 if(!S.stories.length)return'<div class="empty">No stories yet. Paste ING articles in the chat to populate this dashboard.</div>';
 const cats=['All',...new Set(S.stories.map(s=>s.category).filter(Boolean))];
 const list=S.stories.filter(s=>cat==='All'||s.category===cat);
 return `<div class="filters">${cats.map(c=>`<span class="chip ${c===cat?'on':''}" onclick="cat='${esc(c)}';render()">${esc(c)}</span>`).join('')}</div>`+
 list.map(s=>`<section class="story"><h2>${esc(s.name)}</h2><div class="mut">${esc(s.category)} · updated ${esc(s.updated)}</div>
 <p>${esc(s.summary)}</p>${(s.pairs||[]).map(p=>`<span class="tag">${esc(p)}</span>`).join('')}
 <div class="scs">${s.scenarios.map(scCard).join('')}</div>${chart(s)}</section>`).join('')}
function papers(){return S.papers.length?[...S.papers].sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<details><summary>${esc(p.date)} – ${esc(p.title)}</summary><p>${esc(p.summary)}</p>${p.url?`<p><a href="${esc(p.url)}" target="_blank" rel="noopener">Source</a></p>`:''}<div class="mut">Stories: ${(p.story_ids||[]).map(esc).join(', ')}</div></details>`).join(''):'<div class="empty">No papers yet.</div>'}
function changes(){return S.changelog.length?[...S.changelog].sort((a,b)=>b.date.localeCompare(a.date)).map(c=>`<div class="log"><b>${esc(c.date)}</b> – ${esc(c.text)}</div>`).join(''):'<div class="empty">No changes logged yet.</div>'}
function render(){
 document.getElementById('meta').textContent=`${S.papers.length} papers · ${S.stories.length} stories`;
 const V={stories:'Stories & scenarios',papers:'Papers',changes:'What changed'};
 document.getElementById('nav').innerHTML=Object.entries(V).map(([k,v])=>`<button class="${k===view?'on':''}" onclick="view='${k}';render()">${v}</button>`).join('');
 document.getElementById('main').innerHTML={stories,papers,changes}[view]()}
render();
</script></body></html>
